<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1eb" />
    <title>Дарья Анашина — design system</title>
    <style>
      #initial-loader { position: fixed; z-index: 999; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(22px, 4vw, 64px); overflow: hidden; color: #f6f0e4; background: #174aa8; font: 0.62rem/1.3 monospace; transition: opacity .4s ease; }
      #initial-loader::before { content: ""; position: absolute; inset: 0; opacity: .14; background: repeating-radial-gradient(circle at 25% 30%, transparent 0 1px, rgba(255,255,255,.18) 2px 3px, transparent 4px 7px); mix-blend-mode: soft-light; }
      #initial-loader p, #initial-loader span { position: relative; margin: 0; }
      #initial-loader p { font-weight: 700; font-size: clamp(1.2rem, 2.4vw, 2.4rem); line-height: .82; }
      #initial-loader span { display: flex; align-items: center; gap: .9em; }
      #initial-loader i { width: clamp(42px, 8vw, 100px); height: .65em; background: #ff5200; animation: initial-loader-pulse .8s steps(2,end) infinite; }
      #initial-loader.is-hidden { opacity: 0; pointer-events: none; }
      @keyframes initial-loader-pulse { 50% { transform: scaleX(.35); transform-origin: left; } }
    </style>
  </head>
  <body>
    <div id="initial-loader" aria-live="polite" aria-label="Загружаем портфолио"><p>DARIA<br>ANASHINA</p><span>ЗАГРУЖАЕМ РАБОТЫ <i></i></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
